<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhas Tarefas</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="cabecalho">
      <h1>Minhas Tarefas</h1>
      <p>Registre e organize as suas tarefas.</p>
    </header>

    <form id="formulario-tarefa" class="formulario" novalidate>
      <label for="titulo-tarefa" class="visually-hidden">Título da tarefa</label>
      <input
        type="text"
        id="titulo-tarefa"
        name="titulo"
        placeholder="Digite o título da tarefa"
        autocomplete="off"
        maxlength="120"
      />
      <button type="submit" id="botao-adicionar">Adicionar</button>
    </form>

    <p id="contador-tarefas" class="contador"></p>

    <ul id="lista-tarefas" class="lista-tarefas" aria-label="Lista de tarefas"></ul>
    <p id="mensagem-vazia" class="mensagem-vazia">Nenhuma tarefa cadastrada.</p>
  </main>
</body>
</html>
